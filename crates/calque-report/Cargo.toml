[package]
name = "calque-report"
version.workspace = true
edition.workspace = true
license.workspace = true

# NOTE coordination : ce crate rend des « vues » (TraceView, FlowResult)
# construites à partir de calque-model uniquement. L'adaptation depuis les
# types réels de calque-engine (Trace, Hop, Decision) se fait dans
# calque-cli, ce qui évite de coupler les rendus au moteur pendant que
# celui-ci est implémenté en parallèle.

[dependencies]
calque-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
