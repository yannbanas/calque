[package]
name = "calque-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "calque"
path = "src/main.rs"

# La collecte en ligne (S7) est OPTIONNELLE (§8) : sans `--features
# collect`, la pile SSH n'est même pas compilée — l'analyse hors ligne
# reste un binaire sans réseau.
[features]
collect = ["dep:calque-collect", "dep:rpassword"]

[dependencies]
calque-model = { workspace = true }
calque-collect = { workspace = true, optional = true }
# Saisie du mot de passe SANS écho (jamais d'argument --password en
# clair : la ligne de commande est visible de tous les processus et des
# historiques de shell).
rpassword = { version = "7", optional = true }
calque-space = { workspace = true }
calque-policy = { workspace = true }
calque-report = { workspace = true }
calque-engine = { workspace = true }
calque-vendors = { workspace = true }
calque-diff = { workspace = true }
calque-scrub = { workspace = true }
clap = { workspace = true }
ipnet = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
