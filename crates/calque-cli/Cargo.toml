[package]
name = "calque-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "calque"
path = "src/main.rs"

# NOTE coordination : calque-engine, calque-parse, calque-vendors et
# calque-space sont implémentés en parallèle. Le binaire doit compiler quoi
# qu'il arrive, donc ces dépendances restent débranchées tant que leurs API
# ne sont pas posées : les points d'entrée correspondants vivent dans
# `src/backend.rs` et rendent une erreur honnête à l'exécution. Rebrancher
# ici (et dans backend.rs) dès qu'un crate est prêt.

[dependencies]
calque-model = { workspace = true }
calque-policy = { workspace = true }
calque-report = { workspace = true }
clap = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
