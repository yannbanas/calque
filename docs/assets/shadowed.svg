<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"
     aria-label="Le paquet est arrêté par la règle 12 (deny, large) avant d'atteindre la règle 34 (accept, incluse) : votre règle d'autorisation est masquée.">
  <title>shadowed_by — votre règle est masquée par la règle 12</title>

  <style>
    .sh-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sh-ui   { font-family: system-ui, sans-serif; }
  </style>

  <rect x="0" y="0" width="960" height="440" rx="12" fill="#0d1117"/>

  <text x="70" y="48" class="sh-ui" font-size="13" fill="#8b949e">l'évaluation descend — la première correspondance gagne</text>

  <!-- couloir d'évaluation -->
  <line x1="85" y1="62" x2="85" y2="340" stroke="#21262d" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- règle 3 (sans rapport) -->
  <rect x="110" y="80" width="190" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="124" y="100" class="sh-mono" font-size="12.5" fill="#8b949e">règle 3 · accept</text>
  <text x="124" y="118" class="sh-mono" font-size="12" fill="#6e7681">dmz → wan · 443/tcp</text>

  <!-- règle 12 : le deny large qui masque -->
  <rect x="110" y="148" width="460" height="52" rx="8" fill="rgba(248,81,73,0.10)" stroke="#f85149" stroke-width="1.6"/>
  <text x="124" y="169" class="sh-mono" font-size="13" font-weight="600" fill="#f85149">règle 12 · deny</text>
  <text x="124" y="188" class="sh-mono" font-size="12" fill="#8b949e">10.0.0.0/16 → any · tous les ports</text>

  <text x="130" y="226" class="sh-ui" font-size="13" fill="#484f58">···</text>

  <!-- projection : la règle 34 est incluse dans la 12 -->
  <g stroke="#f85149" stroke-width="1" stroke-dasharray="3 4" opacity="0.35">
    <line x1="150" y1="204" x2="150" y2="246"/>
    <line x1="450" y1="204" x2="450" y2="246"/>
  </g>

  <!-- règle 34 : votre accept, jamais atteint -->
  <g opacity="0.5">
    <rect x="150" y="248" width="300" height="52" rx="8" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-dasharray="5 4"/>
    <text x="164" y="269" class="sh-mono" font-size="13" font-weight="600" fill="#3fb950">règle 34 · accept</text>
    <text x="164" y="288" class="sh-mono" font-size="12" fill="#8b949e">10.0.10.5 → 10.0.20.5 · 445/tcp</text>
  </g>
  <text x="466" y="280" class="sh-ui" font-size="12" font-style="italic" fill="#6e7681">jamais atteinte</text>

  <!-- le paquet : descend et frappe la règle 12 -->
  <g opacity="0">
    <circle r="9" fill="#58a6ff" opacity="0.22"/>
    <circle r="5" fill="#58a6ff"/>
    <animateMotion path="M 85 62 L 85 174 L 116 174" calcMode="linear"
                   keyPoints="0;1;1" keyTimes="0;0.4;1"
                   dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0"
             keyTimes="0;0.04;0.62;0.72;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <circle cx="118" cy="174" r="5" fill="none" stroke="#f85149" stroke-width="2" opacity="0">
    <animate attributeName="r" values="5;5;17;17" keyTimes="0;0.4;0.54;1"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.39;0.41;0.56;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- légende du paquet -->
  <circle cx="120" cy="392" r="5" fill="#58a6ff"/>
  <text x="134" y="397" class="sh-mono" font-size="12" fill="#8b949e">votre flux : 10.0.10.5 → 10.0.20.5:445/tcp</text>

  <!-- bulle d'explication -->
  <rect x="610" y="150" width="300" height="64" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="628" y="176" class="sh-ui" font-size="13.5" fill="#e6edf3">votre règle d'autorisation est</text>
  <text x="628" y="196" class="sh-ui" font-size="13.5" fill="#e6edf3">masquée <tspan fill="#f85149">par la règle 12, ligne 340</tspan></text>
  <path d="M 610 198 C 540 212 500 240 460 262" fill="none" stroke="#f85149" stroke-width="1.2" opacity="0.7"/>
  <circle cx="458" cy="263" r="3" fill="#f85149" opacity="0.7"/>

  <!-- extrait de trace -->
  <rect x="600" y="232" width="330" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
  <g class="sh-mono" font-size="12">
    <text x="616" y="258" fill="#8b949e">$ calque path --explain</text>
    <text x="616" y="278" fill="#e6edf3">Verdict : <tspan fill="#f85149">refusé</tspan></text>
    <text x="616" y="298" fill="#e6edf3">filtre d'entrée : refusé</text>
    <text x="616" y="316" fill="#8b949e">  (règle 12, fw-01.conf ligne 340)</text>
    <text x="616" y="336" fill="#e6edf3">  <tspan fill="#f85149">masquée</tspan> par les règles : 12</text>
  </g>
</svg>
