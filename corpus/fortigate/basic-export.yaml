#config-version=FGT60F-7.0.5-FW-build0304-220328:opmode=0:vdom=0:user=admin
#conf_file_ver=000000000000001
# Configuration fictive et anonyme — fixture de test Calque.
# Export YAML équivalent de basic.conf ; adressage RFC1918 inventé.
system_global:
    hostname: "fw-lab-01"
system_interface:
    - lan:
        vdom: "root"
        ip: [10.10.1.1, 255.255.255.0]
        allowaccess: [ping, https, ssh]
        type: physical
        role: lan
    - dmz:
        vdom: "root"
        ip: [10.10.2.1, 255.255.255.0]
        allowaccess: [ping]
        type: physical
        role: dmz
    - wan:
        vdom: "root"
        ip: [10.200.0.2, 255.255.255.252]
        type: physical
        role: wan
system_zone:
    - z-dmz:
        interface: "dmz"
router_static:
    - 1:
        sdwan-zone: "SD-WAN"
        comment: "route par defaut via les deux WAN"
        distance: 10
firewall_address:
    - h-srv-web:
        subnet: [10.10.2.10, 255.255.255.255]
    - r-postes:
        type: iprange
        start-ip: 10.10.1.50
        end-ip: 10.10.1.69
firewall_addrgrp:
    - g-serveurs:
        member: ["h-srv-web", "r-postes"]
firewall_service_custom:
    - TCP-8443:
        tcp-portrange: 8443
    - APP-SYNC:
        tcp-portrange: 7000-7010:1024-65535
        udp-portrange: 7000
firewall_service_group:
    - g-apps:
        member: ["TCP-8443", "APP-SYNC"]
firewall_policy:
    - 1:
        name: "lan-vers-wan"
        srcintf: "lan"
        dstintf: "wan"
        srcaddr: "all"
        dstaddr: "all"
        action: accept
        schedule: "always"
        service: "ALL"
        nat: enable
    - 2:
        name: "lan-vers-dmz-web"
        srcintf: "lan"
        dstintf: "z-dmz"
        srcaddr: "r-postes"
        dstaddr: "h-srv-web"
        action: accept
        schedule: "always"
        service: "TCP-8443"
    - 3:
        name: "dmz-isolement"
        srcintf: "z-dmz"
        dstintf: "lan"
        srcaddr: "all"
        dstaddr: "all"
        action: deny
        schedule: "always"
        service: "ALL"
    - 4:
        name: "ancienne-regle"
        srcintf: "lan"
        dstintf: "wan"
        srcaddr: "g-serveurs"
        dstaddr: "all"
        action: accept
        schedule: "always"
        service: "g-apps"
        status: disable
    - 5:
        name: "dmz-vers-wan"
        srcintf: "z-dmz"
        dstintf: "wan"
        srcaddr: "h-srv-web"
        dstaddr: "all"
        action: accept
        schedule: "always"
        service: "ALL"
system_interface:
    - wan2:
        vdom: "root"
        ip: [10.200.4.2, 255.255.255.252]
        type: physical
        role: wan
    - vpn-site-a:
        vdom: "root"
        type: tunnel
system_sdwan:
    status: enable
    zone:
        - SD-WAN:
    members:
        - 1:
            interface: "wan"
            zone: "SD-WAN"
            gateway: 10.200.0.1
        - 2:
            interface: "wan2"
            zone: "SD-WAN"
            gateway: 10.200.4.1
    health-check:
        - hc-dns:
            server: "10.255.255.1"
            members: [1, 2]
vpn_ipsec_phase1-interface:
    - vpn-site-a:
        interface: "wan"
        remote-gw: 10.201.0.1
        proposal: aes256-sha256
        dhgrp: 14
        psksecret: "SecretFictifPartage"
vpn_ipsec_phase2-interface:
    - vpn-site-a-p2:
        phase1name: "vpn-site-a"
        src-name: "r-lan"
        dst-name: "r-site-a"
        proposal: aes256-sha256
firewall_address:
    - r-lan:
        subnet: [10.10.1.0, 255.255.255.0]
    - r-site-a:
        subnet: [10.60.0.0, 255.255.0.0]
firewall_vip:
    - vip-web-443:
        extip: 10.200.0.10
        extintf: "wan"
        portforward: enable
        mappedip: "10.10.2.10"
        protocol: tcp
        extport: 443
        mappedport: 8443
    - vip-un-pour-un:
        extip: 10.200.0.11
        extintf: "wan"
        mappedip: "10.10.2.11"
firewall_vipgrp:
    - g-vips:
        member: ["vip-web-443", "vip-un-pour-un"]
router_static:
    - 2:
        dstaddr: "r-site-a"
        device: "vpn-site-a"
        distance: 15
firewall_policy:
    - 6:
        name: "wan-vers-dmz-web"
        srcintf: "wan"
        dstintf: "z-dmz"
        srcaddr: "all"
        dstaddr: "vip-web-443"
        action: accept
        schedule: "always"
        service: "ALL"
    - 7:
        name: "wan-vers-dmz-vips"
        srcintf: "wan"
        dstintf: "z-dmz"
        srcaddr: "all"
        dstaddr: "g-vips"
        action: accept
        schedule: "always"
        service: "ALL"
    - 8:
        name: "lan-vers-site-a"
        srcintf: "lan"
        dstintf: "vpn-site-a"
        srcaddr: "r-lan"
        dstaddr: "r-site-a"
        action: accept
        schedule: "always"
        service: "ALL"
firewall_address:
    - fqdn-insights:
        type: fqdn
        fqdn: "insights.nutanix.com"
    - geo-fr:
        type: geography
        country: "FR"
firewall_policy:
    - 20:
        name: "lan-vers-insights"
        srcintf: "lan"
        dstintf: "wan"
        srcaddr: "all"
        dstaddr: "fqdn-insights"
        action: accept
        schedule: "always"
        service: "ALL"
