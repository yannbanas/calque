#config-version=FGT60F-7.0.5-FW-build0304-220328:opmode=0:vdom=0
# Configuration fictive et anonyme — fixture de test Calque.
# Adressage RFC1918 inventé ; aucun équipement ni nom réel.
config system global
    set hostname "fw-lab-01"
end
config system interface
    edit "lan"
        set vdom "root"
        set ip 10.10.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    edit "dmz"
        set vdom "root"
        set ip 10.10.2.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
    next
    edit "wan"
        set vdom "root"
        set ip 10.200.0.2 255.255.255.252
        set type physical
        set role wan
    next
end
config system zone
    edit "z-dmz"
        set interface "dmz"
    next
end
config router static
    edit 1
        set sdwan-zone "SD-WAN"
        set comment "route par defaut via les deux WAN"
        set distance 10
    next
end
config firewall address
    edit "h-srv-web"
        set subnet 10.10.2.10 255.255.255.255
    next
    edit "r-postes"
        set type iprange
        set start-ip 10.10.1.50
        set end-ip 10.10.1.69
    next
end
config firewall addrgrp
    edit "g-serveurs"
        set member "h-srv-web" "r-postes"
    next
end
config firewall service custom
    edit "TCP-8443"
        set tcp-portrange 8443
    next
    edit "APP-SYNC"
        set tcp-portrange 7000-7010:1024-65535
        set udp-portrange 7000
    next
end
config firewall service group
    edit "g-apps"
        set member "TCP-8443" "APP-SYNC"
    next
end
config firewall policy
    edit 1
        set name "lan-vers-wan"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "lan-vers-dmz-web"
        set srcintf "lan"
        set dstintf "z-dmz"
        set srcaddr "r-postes"
        set dstaddr "h-srv-web"
        set action accept
        set schedule "always"
        set service "TCP-8443"
    next
    edit 3
        set name "dmz-isolement"
        set srcintf "z-dmz"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
    next
    edit 4
        set name "ancienne-regle"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "g-serveurs"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "g-apps"
        set status disable
    next
    edit 5
        set name "dmz-vers-wan"
        set srcintf "z-dmz"
        set dstintf "wan"
        set srcaddr "h-srv-web"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
config system interface
    edit "wan2"
        set vdom "root"
        set ip 10.200.4.2 255.255.255.252
        set type physical
        set role wan
    next
    edit "vpn-site-a"
        set vdom "root"
        set type tunnel
    next
end
config system sdwan
    set status enable
    config zone
        edit "SD-WAN"
        next
    end
    config members
        edit 1
            set interface "wan"
            set zone "SD-WAN"
            set gateway 10.200.0.1
        next
        edit 2
            set interface "wan2"
            set zone "SD-WAN"
            set gateway 10.200.4.1
        next
    end
    config health-check
        edit "hc-dns"
            set server "10.255.255.1"
            set members 1 2
        next
    end
end
config vpn ipsec phase1-interface
    edit "vpn-site-a"
        set interface "wan"
        set remote-gw 10.201.0.1
        set proposal aes256-sha256
        set dhgrp 14
        set psksecret "SecretFictifPartage"
    next
end
config vpn ipsec phase2-interface
    edit "vpn-site-a-p2"
        set phase1name "vpn-site-a"
        set src-name "r-lan"
        set dst-name "r-site-a"
        set proposal aes256-sha256
    next
end
config firewall address
    edit "r-lan"
        set subnet 10.10.1.0 255.255.255.0
    next
    edit "r-site-a"
        set subnet 10.60.0.0 255.255.0.0
    next
end
config firewall vip
    edit "vip-web-443"
        set extip 10.200.0.10
        set extintf "wan"
        set portforward enable
        set mappedip "10.10.2.10"
        set protocol tcp
        set extport 443
        set mappedport 8443
    next
    edit "vip-un-pour-un"
        set extip 10.200.0.11
        set extintf "wan"
        set mappedip "10.10.2.11"
    next
end
config firewall vipgrp
    edit "g-vips"
        set member "vip-web-443" "vip-un-pour-un"
    next
end
config router static
    edit 2
        set dstaddr "r-site-a"
        set device "vpn-site-a"
        set distance 15
    next
end
config firewall policy
    edit 6
        set name "wan-vers-dmz-web"
        set srcintf "wan"
        set dstintf "z-dmz"
        set srcaddr "all"
        set dstaddr "vip-web-443"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 7
        set name "wan-vers-dmz-vips"
        set srcintf "wan"
        set dstintf "z-dmz"
        set srcaddr "all"
        set dstaddr "g-vips"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 8
        set name "lan-vers-site-a"
        set srcintf "lan"
        set dstintf "vpn-site-a"
        set srcaddr "r-lan"
        set dstaddr "r-site-a"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
config firewall address
    edit "fqdn-insights"
        set type fqdn
        set fqdn "insights.nutanix.com"
    next
    edit "geo-fr"
        set type geography
        set country "FR"
    next
end
config firewall policy
    edit 20
        set name "lan-vers-insights"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set dstaddr "fqdn-insights"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
