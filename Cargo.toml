[workspace]
resolver = "2"
members = [
    "crates/calque-model",
    "crates/calque-space",
    "crates/calque-engine",
    "crates/calque-policy",
    "crates/calque-diff",
    "crates/calque-parse",
    "crates/calque-vendors",
    "crates/calque-report",
    "crates/calque-scrub",
    "crates/calque-cli",
]
# Les cibles cargo-fuzz ont leur propre espace de travail.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
calque-model = { path = "crates/calque-model" }
calque-space = { path = "crates/calque-space" }
calque-engine = { path = "crates/calque-engine" }
calque-policy = { path = "crates/calque-policy" }
calque-diff = { path = "crates/calque-diff" }
calque-parse = { path = "crates/calque-parse" }
calque-vendors = { path = "crates/calque-vendors" }
calque-report = { path = "crates/calque-report" }
calque-scrub = { path = "crates/calque-scrub" }

ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
petgraph = "0.6"
proptest = "1"
insta = "1"
criterion = "0.5"

# Binaire de diffusion : optimisation inter-crates (LTO) et un seul
# unité de génération de code. Effet mesuré dans docs/performance.md
# (« thin » retenu ; « fat » n'apportait rien de plus ici).
# Le profil `bench` hérite de ces réglages.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
