config firewall address
    edit "a"
        set subnet 999.0.0.1 255.255.0
    next
end
config firewall service custom
    edit "s"
        set tcp-portrange 70000-1:0-99999
    next
end
config firewall policy
    edit 4294967295
        set srcintf "x"
        set dstintf "x"
        set action accept
    next
end
